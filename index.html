<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>カイトクラフト</title>
<style>
:root{
  --ui-bg:rgba(255,255,255,.8);--ui-fg:#1d2a1a;--ui-border:rgba(40,60,30,.35);
  --sel:#ffd54a;--overlay:rgba(24,40,20,.62);--btn:rgba(255,255,255,.3);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ui-bg:rgba(22,26,20,.78);--ui-fg:#eef3e8;--ui-border:rgba(220,240,200,.3);--overlay:rgba(0,0,0,.68);--btn:rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--ui-bg:rgba(22,26,20,.78);--ui-fg:#eef3e8;--ui-border:rgba(220,240,200,.3);--overlay:rgba(0,0,0,.68);--btn:rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#87ceeb;color:var(--ui-fg);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross::before{left:10px;top:0;width:2px;height:22px}
#cross::after{top:10px;left:0;height:2px;width:22px}
#cross.target::before,#cross.target::after{background:#ff3b3b;mix-blend-mode:normal}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:4px;background:var(--ui-bg);border:2px solid var(--ui-border);border-radius:6px;z-index:3}
.slot{width:44px;height:44px;border:3px solid transparent;border-radius:4px;padding:3px;cursor:pointer;position:relative}
.slot.on{border-color:var(--sel)}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot span{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 2px #000}
#stat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:3}
#hpbar{width:200px;height:14px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);border-radius:4px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(#ff6b5e,#d32f2f);transition:width .2s}
#hpfill.low{background:linear-gradient(#ffb74d,#e65100)}
#name{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .4s}
.etag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;text-align:center;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000;display:none;white-space:nowrap}
.etag b{display:block;width:54px;height:6px;margin:2px auto 0;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.7)}
.etag i{display:block;height:100%;background:#e53935}
#held{position:fixed;right:10%;bottom:12%;width:170px;height:170px;image-rendering:pixelated;pointer-events:none;transform:scaleX(-1);transform-origin:70% 90%;z-index:1}
#held.swing{animation:swing .3s ease-out}
@keyframes swing{0%{transform:scaleX(-1) rotate(0)}35%{transform:scaleX(-1) translate(60px,-30px) rotate(-75deg)}100%{transform:scaleX(-1) rotate(0)}}
#leg{position:fixed;left:50%;bottom:0;width:90px;height:170px;background:#ece8e1;border:3px solid #b9b3aa;border-bottom:none;transform:translate(-50%,110%);pointer-events:none;z-index:1}
#leg.kick{animation:kick .4s ease-out}
@keyframes kick{0%{transform:translate(-50%,110%)}40%{transform:translate(-50%,15%) rotate(-8deg)}100%{transform:translate(-50%,110%)}}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px rgba(220,0,0,.85);opacity:0;transition:opacity .35s;z-index:2}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--overlay);z-index:10;padding:24px}
.card{max-width:420px;max-height:100%;overflow:auto;background:var(--ui-bg);border:3px solid var(--ui-border);border-radius:10px;padding:22px 22px 18px;text-align:center;backdrop-filter:blur(6px)}
.card h1{margin:0 0 6px;font-size:30px;letter-spacing:.04em}
.card p{margin:6px 0;line-height:1.6;font-size:14px}
.card table{margin:10px auto;font-size:13px;border-collapse:collapse;text-align:left}
.card td{padding:3px 8px}
.card td:first-child{font-weight:700;white-space:nowrap}
.big{margin-top:12px;font:inherit;font-size:18px;font-weight:700;padding:12px 30px;border:none;border-radius:8px;background:#5f9f35;color:#fff;box-shadow:0 4px 0 #3d6b20;cursor:pointer}
#over .big{background:#c62828;box-shadow:0 4px 0 #7f1414}
#over h1{color:#d32f2f}
.big:focus-visible,#reset:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#goal{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:14px;padding:5px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;z-index:3}
body.touch #goal{top:calc(84px + env(safe-area-inset-top,0px));font-size:12px}
#goal.done{background:rgba(123,31,162,.8)}
#appearsel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 4px}
.apr{font:inherit;font-size:11px;font-weight:800;padding:6px 2px;border-radius:8px;border:3px solid transparent;background:rgba(0,0,0,.08);color:var(--ui-fg);cursor:pointer;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:3px}
.apr canvas{width:36px;height:36px;image-rendering:pixelated;border-radius:6px;background:rgba(0,0,0,.06)}
.apr.on{border-color:#ff9800;background:rgba(255,152,0,.18)}
.apr:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#stagesel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}
.stg{font:inherit;font-size:12px;font-weight:800;padding:8px 4px;border-radius:8px;border:3px solid transparent;background:rgba(0,0,0,.08);color:var(--ui-fg);cursor:pointer;line-height:1.3}
.stg span{display:block;font-size:22px}
.stg.on{border-color:#ff9800;background:rgba(255,152,0,.18)}
.stg:disabled{opacity:.45;cursor:default}
.stg:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#clear{display:none;z-index:13}
#clear h1{color:#7b1fa2}
#mp{margin-top:14px;padding-top:10px;border-top:2px dashed var(--ui-border)}
#mp .mpt{font-weight:800;margin:0 0 6px}
.mprow{display:flex;gap:8px;justify-content:center;margin:6px 0}
.mpb{font:inherit;font-weight:800;font-size:15px;padding:10px 16px;border:none;border-radius:8px;background:#1e88e5;color:#fff;box-shadow:0 3px 0 #0d5aa7;cursor:pointer}
.mpb:focus-visible,#mpCode:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#mpCode{width:120px;font:inherit;font-size:20px;font-weight:800;text-align:center;letter-spacing:.2em;padding:8px;border-radius:8px;border:2px solid var(--ui-border);background:#fff;color:#222;-webkit-user-select:text;user-select:text}
#mpMsg{min-height:1.4em;font-size:13px;font-weight:700}
#mpMsg b{font-size:22px;letter-spacing:.1em}
#reset{margin-top:12px;display:block;margin-left:auto;margin-right:auto;font:inherit;font-size:12px;background:none;border:none;color:var(--ui-fg);opacity:.7;text-decoration:underline;cursor:pointer}
#over{display:none}
#touchui{display:none}
body.touch #touchui{display:block}
body.touch #hotbar{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}
body.touch .slot{width:31px;height:31px;padding:2px;border-width:2px}
body.touch #hpbar{width:110px}
body.touch #stat{bottom:auto;top:calc(58px + env(safe-area-inset-top,0px))}
body.touch #hpbar{width:150px}
body.touch #name{bottom:auto;top:calc(110px + env(safe-area-inset-top,0px))}
body.touch #held{width:120px;height:120px;right:34%;bottom:20%}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:none;pointer-events:none;z-index:3}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}
#joyzone{position:fixed;left:0;bottom:0;width:50%;height:50%;pointer-events:none;background:radial-gradient(circle at 30% 70%,rgba(255,255,255,.12),transparent 55%);border-top-right-radius:40px}
#joyhint{position:fixed;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.8}
.tbtn{position:fixed;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:var(--btn);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:3}
.tbtn.down{background:rgba(255,213,74,.55)}
#bJump{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bSword{right:84px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:72px;height:72px;font-size:32px;border-color:rgba(255,120,120,.9)}
#bBreak{right:168px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bKick{right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#bPlace{right:92px;bottom:calc(108px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-weight:700;padding:8px 16px;border-radius:20px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;white-space:nowrap}
#cook{display:none;z-index:12;background:rgba(40,24,10,.72)}
#cook .card{width:min(94vw,400px);padding:14px 14px 16px}
#cook h2{margin:0 0 6px;font-size:22px}
#steps{display:flex;justify-content:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:700}
#steps span{padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.08);opacity:.55}
#steps span.now{background:#ff9800;color:#fff;opacity:1}
#steps span.fin{opacity:1}
#cinst{font-size:14px;line-height:1.5;min-height:42px;margin:4px 0 8px}
#cookcv{width:100%;aspect-ratio:320/220;display:block;border-radius:8px;background:#6b4a2b;touch-action:none}
#cfb{height:26px;margin:6px 0 2px;font-size:18px;font-weight:800;color:#e65100}
#cbtns{display:flex;gap:10px;justify-content:center}
#cbtns button{font:inherit;font-size:19px;font-weight:800;padding:12px 18px;border:none;border-radius:10px;background:#ff9800;color:#fff;box-shadow:0 4px 0 #b36200;cursor:pointer;min-width:120px}
#cbtns button#cB{background:#43a047;box-shadow:0 4px 0 #2b6b2e}
#cbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #b36200}
#cbtns button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#cres{font-size:15px;line-height:1.6;margin:6px 0}
#cres strong{font-size:22px}
#wbar{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3}
body.touch #wbar{top:calc(100px + env(safe-area-inset-top,0px));transform:none}
.wb{width:46px;height:46px;border-radius:8px;background:var(--ui-bg);border:3px solid var(--ui-border);padding:4px;cursor:pointer}
.wb.on{border-color:#ff5252}
.wb canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#held.gun{right:28%;bottom:-10px;transform:none;transform-origin:50% 100%}
body.touch #held.gun{right:40%;bottom:-6px}
#held.gun.recoil{animation:recoil .09s linear}
@keyframes recoil{0%{transform:translateY(0)}50%{transform:translateY(14px)}100%{transform:translateY(0)}}
#flash{position:fixed;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(#fffbe0,#ffb300 45%,transparent 70%);pointer-events:none;opacity:0;z-index:2}
#cross.hit::before,#cross.hit::after{background:#ffeb3b;mix-blend-mode:normal}
#craft{display:none;z-index:12;background:rgba(20,30,50,.7)}
#craft .card{width:min(94vw,420px);padding:14px}
#craft h2{margin:0 0 4px}
#mats{font-weight:800;font-size:16px}
.rc{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--ui-border);text-align:left}
.rc canvas{width:44px;height:44px;image-rendering:pixelated;flex:none;background:rgba(0,0,0,.08);border-radius:6px}
.rc .nm{font-weight:800;font-size:15px}
.rc .cost{font-size:12px;opacity:.85;line-height:1.4}
.rc button{margin-left:auto;flex:none;font:inherit;font-weight:800;padding:9px 14px;border:none;border-radius:8px;background:#1e88e5;color:#fff;cursor:pointer}
.rc button:disabled{background:#9e9e9e;cursor:default}
@media (prefers-reduced-motion: reduce){#name,#hurt{transition:none}}
</style>
</head>
<body>
<div id="game"></div>
<canvas id="held" width="16" height="16"></canvas>
<div id="leg"></div>
<div id="hurt"></div>
<div id="cross"></div>
<div id="name"></div>
<div id="stat"><span>❤️</span><div id="hpbar"><div id="hpfill"></div></div><span id="kills">⚔️ 0</span><span id="cscore">🍳 0</span><span id="mat">🪵0 🪨0</span><span id="room"></span></div>
<div id="wbar"></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="hotbar"></div>
<div id="tags"></div>
<div id="touchui">
  <div id="joyzone"></div><div id="joyhint">ここをなぞって移動</div>
  <div id="joy"><div id="knob"></div></div>
  <div class="tbtn" id="bBreak" aria-label="こわす">⛏️</div>
  <div class="tbtn" id="bPlace" aria-label="おく">🧱</div>
  <div class="tbtn" id="bSword" aria-label="剣でこうげき">⚔️</div>
  <div class="tbtn" id="bKick" aria-label="キック">🦶</div>
  <div class="tbtn" id="bJump" aria-label="ジャンプ">⬆️</div>
</div>
<div id="overlay" class="overlay">
  <div class="card">
    <h1>カイトクラフト</h1>
    <p>ステージのゴールを達成するとポータル🌀が出て、次のステージへ進めるよ。ブロックで世界をつくろう。牛をたおすと料理ができる。木や石を集めて作業台で武器を作ろう。でも気をつけて、ゾンビやエンティティゼロ、ミミッカーがやってくる。</p>
    <table id="help"></table>
    <p class="mpt" style="margin:8px 0 4px">🧑 見た目（2人プレイの相手に見える姿）</p>
    <div id="appearsel"></div>
    <div id="stagesel"></div>
    <button id="start" class="big">あそぶ</button>
    <p id="msg" style="display:none;font-size:13px;color:#c0392b;font-weight:700"></p>
    <div id="mp">
      <p class="mpt">2人で遊ぶ（同じWi‑Fi・テスト版）</p>
      <div class="mprow"><button id="mpHost" class="mpb">部屋を作る</button></div>
      <div class="mprow"><input id="mpCode" type="text" inputmode="numeric" maxlength="4" placeholder="部屋番号" autocomplete="off"><button id="mpJoin" class="mpb">入る</button></div>
      <p id="mpMsg"></p>
    </div>
    <button id="reset">世界を作り直す</button>
  </div>
</div>
<div id="cook" class="overlay">
  <div class="card">
    <h2>🍳 料理モード</h2>
    <div id="steps"><span>1 切る</span><span>2 味付け</span><span>3 焼く</span></div>
    <p id="cinst"></p>
    <canvas id="cookcv" width="320" height="220"></canvas>
    <div id="cfb"></div>
    <div id="cres"></div>
    <div id="cbtns"><button id="cA"></button><button id="cB"></button></div>
  </div>
</div>
<div id="craft" class="overlay">
  <div class="card">
    <h2>🛠️ 作業台</h2>
    <p id="mats"></p>
    <div id="recipes"></div>
    <button id="craftClose" class="big">とじる</button>
  </div>
</div>
<div id="clear" class="overlay">
  <div class="card">
    <h1>🎉 ぜんぶクリア！</h1>
    <p>クジラのおなかから脱出成功！ すべてのステージをクリアしたよ。</p>
    <button id="clearBtn" class="big">草原にもどる</button>
  </div>
</div>
<div id="goal"></div>
<div id="over" class="overlay">
  <div class="card">
    <h1>ゲームオーバー</h1>
    <p id="result"></p>
    <button id="again" class="big">もう一度</button>
  </div>
</div>

<script>
function showMsg(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';}
window.startGame=null;
(function(){
  var btn=document.getElementById('start'),fired=0;
  function go(e){ if(e){e.preventDefault();} var now=Date.now(); if(now-fired<400)return; fired=now;
    if(window.startGame) window.startGame(); else if(!window.__failed) showMsg('読み込み中です。少し待ってからもう一度押してください。'); }
  btn.addEventListener('click',go);
  btn.addEventListener('touchend',go,{passive:false});
})();
function fail(t){window.__failed=true;showMsg(t);}
</script>
<script>
function main(){
// ---------- 効果音（あとで音を入れる場所） ----------
// 音を追加するときは SFX.名前 = (ctx, info) => { ...WebAudioで鳴らす... } を書くだけ。
// ゲーム内のできごとから sfx('名前', 情報) が呼ばれるようになっている。
//  enemyNear  : 敵が近くにいる   {type:'zero'|'zombie'|'mimic', dist, volume(0〜1)}
//  playerHurt : プレイヤーがダメージ {dmg, hp}
//  swing / kick / enemyHit {type} / enemyDie {type} / noEffect（ゾンビにキック以外）
//  shoot {weapon} / rocketFire / explode / blockBreak / blockPlace / pickup {kind}
//  cookStart / gameOver
const SFX={};
let audioCtx=null;
function initAudio(){
  try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}
}
function sfx(name,info){const f=SFX[name];if(!f||!audioCtx)return;try{f(audioCtx,info||{});}catch(e){}}

// ---- 効果音の中身（Web Audioで簡易合成） ----
let _noiseBuf=null;
function noiseBuffer(ctx){
  if(_noiseBuf&&_noiseBuf.ctx===ctx) return _noiseBuf.buf;
  const buf=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*0.5|0),ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  _noiseBuf={ctx,buf};
  return buf;
}
function envGain(g,vol,t0,attack,decay){
  g.gain.cancelScheduledValues(t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+attack);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+attack+decay);
}
SFX.enemyNear=(ctx,info)=>{
  const t0=ctx.currentTime, vol=0.04+0.16*Math.min(1,info.volume||0.3);
  if(info.type==='zombie'){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=68;
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.type='sine';lfo.frequency.value=5.5;lg.gain.value=9;
    lfo.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(ctx.destination);
    envGain(g,vol,t0,0.06,0.5);
    lfo.start(t0);o.start(t0);lfo.stop(t0+0.6);o.stop(t0+0.6);
  }else if(info.type==='mimic'){
    for(let i=0;i<3;i++){
      const st=t0+i*0.075;
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';
      o.frequency.value=850+Math.random()*550;o.connect(g);g.connect(ctx.destination);
      envGain(g,vol*0.7,st,0.004,0.05);
      o.start(st);o.stop(st+0.07);
    }
  }else{
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o2.type='sine';
    o.frequency.setValueAtTime(320,t0);o.frequency.exponentialRampToValueAtTime(255,t0+0.45);
    o2.frequency.value=326;
    o.connect(g);o2.connect(g);g.connect(ctx.destination);
    envGain(g,vol*0.6,t0,0.08,0.45);

// ---------- physics ----------
function hitsBox(px,py,pz,r,h){
  const x0=Math.floor(px-r),x1=Math.floor(px+r-1e-4),y0=Math.floor(py),y1=Math.floor(py+h-1e-4),z0=Math.floor(pz-r),z1=Math.floor(pz+r-1e-4);
  for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++) if(solidAt(x,y,z)) return true;
  return false;
}
// moves body b {x,y,z,vx,vy,vz,ground}; returns true if horizontally blocked
function moveBody(b,dt,r,h){
  let blocked=false;
  const nx=b.x+b.vx*dt; if(!hitsBox(nx,b.y,b.z,r,h))b.x=nx; else blocked=true;
  const nz=b.z+b.vz*dt; if(!hitsBox(b.x,b.y,nz,r,h))b.z=nz; else blocked=true;
  const ny=b.y+b.vy*dt; b.ground=false;
  if(!hitsBox(b.x,ny,b.z,r,h)) b.y=ny;
  else { if(b.vy<0){b.ground=true;b.y=Math.floor(ny)+1;} b.vy=0; }
  return blocked;
}
function surfaceY(x,z){let y=H-1;while(y>0&&!solidAt(Math.floor(x),y,Math.floor(z)))y--;return y+1;}

function damageEnemy(e,dmg,kb,src,how){

    if(!src){const n=performance.now();if(n-immuneT>2500){immuneT=n;toast('ゾンビにはキックしか効かない！ 🦶');}
      const dx=e.x-P.x,dz=e.z-P.z,l=Math.hypot(dx,dz)||1;e.kx=dx/l*1.5;e.kz=dz/l*1.5;sfx('noEffect',{type:e.type});}

  }
  sfx('enemyHit',{type:e.type});
  const byPlayer=!src,sx=src?src.x:P.x,sz=src?src.z:P.z;
  e.hp-=dmg;e.hurt=0.25;
  const dx=e.x-sx,dz=e.z-sz,l=Math.hypot(dx,dz)||1;
  e.kx=dx/l*kb;e.kz=dz/l*kb;e.vy=Math.max(e.vy,kb>8?6.5:4.5);e.atk=0;

    if(e.type==='cow'){
      if(byPlayer){pendingCook=0.7;toast('🥩 肉と 🥛 ミルクを手に入れた！');}
      else {dropItems(e.x,e.y+0.6,e.z);if(Math.hypot(e.x-P.x,e.z-P.z)<24)toast('ミミッカーが牛をおそった！ 肉とミルクが落ちたよ');}

function mobAlive(m){return m&&m.dying<=0&&m.hp>0&&enemies.includes(m);}
function updateMimic(e,dt){
  e.think-=dt;
  if(e.think<=0||(e.target!=='P'&&!mobAlive(e.target))||(e.target==='P'&&dead)){
    e.think=0.5;let best=null,bd=26;
    if(!dead){const d=Math.hypot(P.x-e.x,P.z-e.z);if(d<bd){bd=d;best='P';}}
    for(const m of enemies){if(m===e||m.type==='mimic'||m.type==='zombie'||m.dying>0)continue;const d=Math.hypot(m.x-e.x,m.z-e.z);if(d<bd){bd=d;best=m;}}
    e.target=best;
  }
  const tg=e.target,tx=tg==='P'?P.x:tg?tg.x:e.x,tz=tg==='P'?P.z:tg?tg.z:e.z,ty=tg==='P'?P.y:tg?tg.y:e.y,tr=tg==='P'?PR:tg?tg.r:0;
  const dx=tx-e.x,dz=tz-e.z,dist=Math.hypot(dx,dz)||0.001,reach=0.85+tr;
  let sp=0;
  if(tg){e.dirYaw=Math.atan2(-dx,-dz);if(dist>reach&&e.atk<=0)sp=2.9;}
  else{if(Math.random()<dt*0.3)e.dirYaw=Math.random()*6.28;sp=0.8;}
  let dy=e.dirYaw-e.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));e.yaw+=dy*Math.min(1,8*dt);
  e.vx=-Math.sin(e.yaw)*sp+e.kx;e.vz=-Math.cos(e.yaw)*sp+e.kz;
  const damp=Math.min(1,5*dt);e.kx-=e.kx*damp;e.kz-=e.kz*damp;
  e.vy-=26*dt;if(e.vy<-30)e.vy=-30;
  const blocked=moveBody(e,dt,e.r,e.h);
  if(blocked&&e.ground&&sp>0)e.vy=8.2;
  e.walk+=dt*sp*3;e.hurt-=dt;e.cd-=dt;
  if(e.atk>0){
    e.atk-=dt;
    if(e.atk<=0.2&&!e.struck){e.struck=true;
      if(tg&&dist<reach+0.9&&Math.abs(ty-e.y)<2){ if(tg==='P')hurtPlayer(4,e.x,e.z); else damageEnemy(tg,4,5,e); }}
    if(e.atk<0)e.atk=0;
  } else if(tg&&dist<reach&&Math.abs(ty-e.y)<2&&e.cd<=0){e.atk=0.45;e.cd=1.1;e.struck=false;}
}
function updateCow(e,dt){

  if(e.flee>0){e.flee-=dt;e.dirYaw=Math.atan2(-(e.x-e.fleeX),-(e.z-e.fleeZ));e.moving=true;sp=3.3;}
  else{
    e.think-=dt;
    if(e.think<=0){e.think=2+Math.random()*3;e.moving=Math.random()<0.55;e.dirYaw=Math.random()*Math.PI*2;}
    sp=e.moving?1.1:0;
  }
  let dy=e.dirYaw-e.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));e.yaw+=dy*Math.min(1,6*dt);
  e.vx=-Math.sin(e.yaw)*sp+e.kx;e.vz=-Math.cos(e.yaw)*sp+e.kz;
  const damp=Math.min(1,5*dt);e.kx-=e.kx*damp;e.kz-=e.kz*damp;
  e.vy-=26*dt;if(e.vy<-30)e.vy=-30;
  const blocked=moveBody(e,dt,e.r,e.h);
  if(blocked&&e.ground&&sp>0){ if(e.flee>0)e.vy=8.2; else {e.vy=7.5;if(Math.random()<0.4)e.think=0;} }
  e.walk+=dt*(sp>0?sp*3:1);
  e.hurt-=dt;
}
function updateEnemies(dt){
  if(net.connected){if(enemies.length)enemies=[];if(items.length)items=[];return;}
  spawnTimer-=dt;cowTimer-=dt;
  const aliveZ=enemies.filter(e=>e.dying<=0&&e.type==='zero').length;
  const aliveC=enemies.filter(e=>e.dying<=0&&e.type==='cow').length;
  if(spawnTimer<=0&&aliveZ<STAGES[stage].mobs.zero){spawnEnemy('zero');spawnTimer=Math.max(5,12-kills*0.5);}
  if(cowTimer<=0&&aliveC<STAGES[stage].mobs.cow){spawnEnemy('cow');cowTimer=10;}
  zombieTimer-=dt;
  if(zombieTimer<=0&&enemies.filter(e=>e.dying<=0&&e.type==='zombie').length<STAGES[stage].mobs.zombie){spawnEnemy('zombie');zombieTimer=8;}
  mimicTimer-=dt;
  if(mimicTimer<=0&&enemies.filter(e=>e.dying<=0&&e.type==='mimic').length<STAGES[stage].mobs.mimic){spawnEnemy('mimic');mimicTimer=22;}
  for(const e of enemies){
    if(e.dying>0){e.dying-=dt;e.scale=Math.max(0.01,e.dying/0.5);continue;}
    if(e.type!=='cow'){e.nearCd=(e.nearCd||0)-dt;const nd=Math.hypot(P.x-e.x,P.z-e.z);
      if(nd<10&&e.nearCd<=0){e.nearCd=2.5+Math.random();sfx('enemyNear',{type:e.type,dist:nd,volume:1-nd/10});}}
    if(e.type==='cow'){updateCow(e,dt);if(e.y<-20)e.dying=0.01;continue;}
    if(e.type==='mimic'){updateMimic(e,dt);if(e.y<-20)e.dying=0.01;continue;}
    const dx=P.x-e.x,dz=P.z-e.z,dist=Math.hypot(dx,dz)||0.001;
    e.yaw=Math.atan2(-dx,-dz);
    const chase=dist<30&&dist>1.2&&e.atk<=0?1:0;
    const sp=e.spd;
    e.vx=dx/dist*sp*chase+e.kx;e.vz=dz/dist*sp*chase+e.kz;
    const damp=Math.min(1,5*dt);e.kx-=e.kx*damp;e.kz-=e.kz*damp;
    e.vy-=26*dt;if(e.vy<-30)e.vy=-30;
    const blocked=moveBody(e,dt,0.3,1.8);
    if(blocked&&e.ground&&chase)e.vy=8.2;
    e.walk+=dt*sp*chase*3;
    e.hurt-=dt;e.cd-=dt;
    if(e.atk>0){
      e.atk-=dt;
      if(e.atk<=0.15&&!e.struck){e.struck=true;if(dist<2.2&&Math.abs(P.y-e.y)<1.6)hurtPlayer(e.dmg,e.x,e.z);}
      if(e.atk<0)e.atk=0;
    } else if(dist<1.8&&Math.abs(P.y-e.y)<1.6&&e.cd<=0){e.atk=0.55;e.cd=e.type==='zombie'?1.6:1.3;e.struck=false;}
    if(e.y<-20)e.dying=0.01;
  }
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),md=a.r+b.r+0.1;
    if(d>0.001&&d<md){const p=(md-d)/2/d;const ox=dx*p,oz=dz*p;
      if(!hitsBox(a.x-ox,a.y,a.z-oz,a.r,a.h)){a.x-=ox;a.z-=oz;}
      if(!hitsBox(b.x+ox,b.y,b.z+oz,b.r,b.h)){b.x+=ox;b.z+=oz;}}
  }
  enemies=enemies.filter(e=>!(e.dying<0||(e.hp<=0&&e.dying<=0)));
}
function findTarget(reach){
  const f=fwd();let best=null,bd=1e9;
  for(const e of enemies){
    if(e.dying>0)continue;
    const vx=e.x-cam[0],vy=e.y+e.h*0.5-cam[1],vz=e.z-cam[2],d=Math.hypot(vx,vy,vz);
    if(d>reach+0.4)continue;
    const c=(vx*f[0]+vy*f[1]+vz*f[2])/d;
    if(c<0.72&&d>1.0)continue;
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

function raycast(max){
  const o={x:cam[0],y:cam[1],z:cam[2]}, dv=fwd(), d={x:dv[0],y:dv[1],z:dv[2]};
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);
  const tdx=d.x?Math.abs(1/d.x):Infinity,tdy=d.y?Math.abs(1/d.y):Infinity,tdz=d.z?Math.abs(1/d.z):Infinity;
  let tx=d.x?((sx>0?x+1-o.x:o.x-x)*tdx):Infinity,ty=d.y?((sy>0?y+1-o.y:o.y-y)*tdy):Infinity,tz=d.z?((sz>0?z+1-o.z:o.z-z)*tdz):Infinity;
  let prev=null,t=0;
  while(t<=max){
    if(getB(x,y,z)) return {hit:[x,y,z],prev,t};
    prev=[x,y,z];
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=tdx;} else if(ty<tz){y+=sy;t=ty;ty+=tdy;} else {z+=sz;t=tz;tz+=tdz;}
  }
  return null;
}

function rayBox(o,d,mn,mx){
  let t0=0,t1=1e9;
  for(let i=0;i<3;i++){
    if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mx[i])return Infinity;continue;}
    let a=(mn[i]-o[i])/d[i],b=(mx[i]-o[i])/d[i];if(a>b){const t=a;a=b;b=t;}
    t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return Infinity;
  }
  return t0;
}

function explode(x,y,z){
  booms.push({x,y,z,t:0});sfx('explode');

  }

  for(const e of enemies){if(e.dying>0)continue;const dd=Math.hypot(e.x-x,e.y+e.h/2-y,e.z-z);

  for(const r of rockets){

    for(let k=0;k<4&&!boom;k++){
      r.x+=r.vx*dt/4;r.y+=r.vy*dt/4;r.z+=r.vz*dt/4;
      if(solidAt(Math.floor(r.x),Math.floor(r.y),Math.floor(r.z))&&r.y<H)boom=true;
      for(const e of enemies){if(e.dying>0)continue;if(Math.abs(r.x-e.x)<e.r+0.25&&Math.abs(r.z-e.z)<e.r+0.25&&r.y>e.y&&r.y<e.y+e.h){boom=true;break;}}
    }
    if(r.t>3)boom=true;
    if(boom){r.dead=true;explode(r.x,r.y,r.z);}
  }
  rockets=rockets.filter(r=>!r.dead);

}

    const sq=ck.flipT>0?Math.abs(Math.cos(ck.flipT/0.35*Math.PI)):1;

    if(ck.side===1&&!ck.done){cx.fillStyle='rgba(70,35,15,.5)';for(let i=0;i<3;i++)cx.fillRect(118+i*24,138-hh/2+4,5,hh-8);}
    for(const m of ck.smoke){cx.fillStyle=m.dark?`rgba(40,40,40,${m.a*.7})`:`rgba(255,255,255,${m.a*.6})`;cx.fillRect(m.x,m.y,5,5);}
    gauge(30,26,260,14,ck.c,55,75,false);
    cx.fillStyle='#fff';cx.font='bold 12px sans-serif';cx.fillText('生',30,56);cx.fillText('こげ',262,56);
    cx.fillText(ck.side===0?'おもて':'うら',140,56);
  } else {
    cx.fillStyle='#fff3e0';cx.fillRect(0,0,320,220);
    cx.fillStyle='#fff';cx.beginPath();cx.ellipse(135,125,105,62,0,0,Math.PI*2);cx.fill();cx.strokeStyle='#d7ccc8';cx.lineWidth=3;cx.stroke();
    cx.fillStyle='#8d4f25';cx.fillRect(75,95,110,60);cx.fillStyle='#5d3317';for(let i=0;i<4;i++)cx.fillRect(85+i*25,100,6,50);
    cx.fillStyle='#fff';for(const d of [[90,110],[120,130],[150,105],[170,140]])cx.fillRect(d[0],d[1],3,3);
    cx.fillStyle='#43a047';cx.fillRect(190,110,16,16);cx.fillStyle='#ff7043';cx.fillRect(192,132,22,10);
    cx.fillStyle='#e3f2fd';cx.fillRect(250,70,40,80);cx.fillStyle='#fff';cx.fillRect(254,86,32,60);
    cx.fillStyle='#90a4ae';cx.font='bold 12px sans-serif';cx.fillText('ミルク',252,168);
  }
}

// ---------- 2人プレイ（PeerJS・テスト版） ----------
const PEER_PREFIX='bcraft-mp-v1-';
const net={role:null,peer:null,conn:null,code:null,connected:false,busy:false,sendT:0,out:[]};
let remote=null;
const mpMsgEl=document.getElementById('mpMsg'),codeIn=document.getElementById('mpCode'),roomEl=document.getElementById('room');
const remoteTag=document.createElement('div');remoteTag.className='etag';remoteTag.textContent='ともだち';document.getElementById('tags').appendChild(remoteTag);
function mpSay(t,err){mpMsgEl.innerHTML=t;mpMsgEl.style.color=err?'#c62828':'';}
function roomHud(){roomEl.textContent=net.code?('🏠'+net.code+' 👥'+(net.connected?2:1)):'';}
function encodeWorld(){let s='';for(let i=0;i<world.length;i+=8192)s+=String.fromCharCode.apply(null,world.subarray(i,i+8192));return btoa(s);}
function decodeWorld(b64){const b=atob(b64);if(b.length!==W*D*H)return false;for(let i=0;i<b.length;i++)world[i]=b.charCodeAt(i);return true;}
function netSend(m){try{if(net.conn&&net.conn.open)net.conn.send(m);}catch(e){}}
function netBlock(x,y,z,id){if(net.connected)net.out.push([x,y,z,id]);}
function netAct(a){if(net.connected)netSend({t:'act',a});}
function loadPeerJS(cb){
  if(window.Peer) return cb();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>window.Peer?cb():mpFail('通信の部品を読み込めませんでした');
  s.onerror=()=>mpFail('通信の部品を読み込めませんでした。GitHub Pagesで開いているか確認してね');
  document.head.appendChild(s);
}
function mpFail(t){mpSay(t,true);net.busy=false;}
function mpCleanup(){try{if(net.peer)net.peer.destroy();}catch(e){}net.peer=null;net.conn=null;net.role=null;net.code=null;net.connected=false;net.busy=false;remote=null;roomHud();}
function hostRoom(){
  if(net.busy||net.peer) return;
  net.busy=true;mpSay('部屋を準備しています…');
  loadPeerJS(()=>{
    const tryOpen=(n)=>{
      const code=String(1000+Math.floor(Math.random()*9000));
      const peer=new Peer(PEER_PREFIX+code);
      peer.on('open',()=>{net.peer=peer;net.role='host';net.code=code;net.busy=false;roomHud();
        mpSay('部屋番号 <b>'+code+'</b><br>相手の端末で「入る」にこの番号を入れてね。先に「あそぶ」で始めてもOK');});
      peer.on('connection',conn=>{
        if(net.conn&&net.conn.open){conn.on('open',()=>{conn.send({t:'full'});setTimeout(()=>conn.close(),500);});return;}
        setupConn(conn);});
      peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
      peer.on('error',err=>{
        if(err.type==='unavailable-id'&&n<5){try{peer.destroy();}catch(e){}tryOpen(n+1);return;}
        if(!net.peer){mpFail('部屋を作れませんでした（'+err.type+'）');try{peer.destroy();}catch(e){}}
        else toast('通信エラー：'+err.type);});
    };
    tryOpen(0);
  });
}
function joinRoom(){
  const code=(codeIn.value||'').replace(/\D/g,'');
  if(code.length!==4){mpSay('4けたの部屋番号を入れてね',true);return;}
  if(net.busy||net.peer) return;
  net.busy=true;mpSay('つないでいます…');
  loadPeerJS(()=>{
    const peer=new Peer();net.peer=peer;
    peer.on('open',()=>{
      net.role='guest';net.code=code;
      setupConn(peer.connect(PEER_PREFIX+code,{reliable:true}));
      setTimeout(()=>{if(!net.connected&&net.role==='guest'){mpCleanup();mpFail('つながりませんでした。番号と、2台が同じWi‑Fiかを確認してね');}},15000);
    });
    peer.on('error',err=>{
      const t=err.type==='peer-unavailable'?'その番号の部屋が見つかりません。番号を確認してね':'つながりませんでした（'+err.type+'）';
      if(!net.connected){mpCleanup();mpFail(t);} else toast('通信エラー：'+err.type);
    });
  });
}
function setupConn(conn){
  net.conn=conn;
  conn.on('open',()=>{
    net.connected=true;net.busy=false;enemies=[];items=[];roomHud();
    if(net.role==='host'){netSend({t:'world',w:encodeWorld(),x:P.x,y:P.y,z:P.z,s:stage});toast('🙌 ともだちが入ってきた！');mpSay('ともだちがつながりました');}
    else mpSay('つながった！ 世界を受け取っています…');
  });
  conn.on('data',onNet);
  conn.on('close',onNetClose);
  conn.on('error',onNetClose);
}
function onNetClose(){
  if(!net.connected&&net.role!=='guest')return;
  const wasGuest=net.role==='guest';
  net.connected=false;remote=null;net.conn=null;net.out=[];
  spawnTimer=4;cowTimer=6;mimicTimer=20;zombieTimer=5;
  if(wasGuest){mpCleanup();goStage(0);}
  roomHud();toast('📴 通信が切れました。ひとりプレイにもどります');
}
function onNet(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='world'){
    if(typeof m.s==='number'&&m.s!==stage){stage=m.s;applyStageLook(stage);goalDone=false;portalLock=false;lastGoalTxt='';}
    if(decodeWorld(m.w)){buildMesh();P.x=m.x+1;P.z=m.z;P.y=standAt(P.x,P.z,Math.floor(m.y));P.vx=P.vy=P.vz=0;portalLock=false;updateGoalHud();}
    mpSay('つながった！ いっしょに遊べます');
    if(!started&&!dead)window.startGame();
    toast('🙌 ホストの世界に入った！');
  } else if(m.t==='pos'){
    if(!remote)remote={x:m.x,y:m.y,z:m.z,yaw:m.yaw,pitch:m.pitch,walk:0,swing:0,scale:1,appearance:0};
    remote.tx=m.x;remote.ty=m.y;remote.tz=m.z;remote.tyaw=m.yaw;remote.pitch=m.pitch;remote.appearance=m.ap|0;
  } else if(m.t==='blk'){
    for(const c of m.c){const[x,y,z,id]=c;if(x>=0&&z>=0&&y>=0&&x<W&&z<D&&y<H){const old=world[idx(x,y,z)];
      if(net.role==='host'&&id===0){if(old===12)stageStats.gems++;if(old===19)stageStats.chests++;}world[idx(x,y,z)]=id;}}
    buildMesh();if(net.role==='host')queueSave();
    if(hits(P.x,P.y,P.z)){let y=Math.floor(P.y);while(y<H&&hits(P.x,y,P.z))y++;P.y=y;}
  } else if(m.t==='act'){
    if(remote)remote.swing=0.3;
  } else if(m.t==='portal'){
    if(net.role==='host'&&goalDone)goStage(stage+1);
  } else if(m.t==='full'){
    mpCleanup();mpFail('その部屋はもう2人いっぱいです');
  }
}
function netTick(dt){
  if(remote&&remote.tx!==undefined){
    const k=Math.min(1,dt*12),ox=remote.x,oz=remote.z;
    remote.x+=(remote.tx-remote.x)*k;remote.y+=(remote.ty-remote.y)*k;remote.z+=(remote.tz-remote.z)*k;
    let dy=remote.tyaw-remote.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));remote.yaw+=dy*k;
    remote.walk+=Math.hypot(remote.x-ox,remote.z-oz)*3.2;remote.swing=Math.max(0,remote.swing-dt);
  }
  if(!net.connected){net.out.length=0;return;}
  net.sendT-=dt;
  if(net.sendT<=0){net.sendT=0.066;netSend({t:'pos',x:+P.x.toFixed(3),y:+P.y.toFixed(3),z:+P.z.toFixed(3),yaw:+yaw.toFixed(3),pitch:+pitch.toFixed(3),ap:myAppearance});}
  if(net.out.length){netSend({t:'blk',c:net.out});net.out=[];}
}
const APPEARANCES=[
  {name:'ノーマル',face:36,side:37,top:38,skin:41,shirt:39,pants:40,arm:41},
  {name:'ゴールド',face:58,side:59,top:60,skin:61,shirt:62,pants:63,arm:61},
  {name:'消防士',face:64,side:65,top:66,skin:67,shirt:68,pants:69,arm:70},
  {name:'はかせ',face:71,side:72,top:73,skin:74,shirt:75,pants:76,arm:77}
];
const APPEAR_KEY='blockcraft-appearance-v1';
let myAppearance=0;
try{const j=parseInt(localStorage.getItem(APPEAR_KEY),10);if(j>=0&&j<APPEARANCES.length)myAppearance=j;}catch(e){}
function setAppearance(i){myAppearance=i;try{localStorage.setItem(APPEAR_KEY,String(i));}catch(e){}}
function apTex(i){const a=APPEARANCES[i]||APPEARANCES[0];
  return {face:[a.side,a.side,a.skin,a.top,a.face,a.top],shirt:[a.shirt,a.shirt,a.shirt,a.shirt,a.shirt,a.shirt],pants:[a.pants,a.pants,a.pants,a.pants,a.pants,a.pants],arm:[a.arm,a.arm,a.arm,a.arm,a.arm,a.arm]};}
function avatarVerts(e,out){
  const tex=apTex(e.appearance||0);
  const sw=Math.sin(e.walk)*0.6;
  const armR=e.swing>0?1.6+Math.sin((0.3-e.swing)/0.3*Math.PI)*0.8:-sw*0.8;
  pushBox(out,[-0.125,-0.55,-0.125],[0.125,0,0.125],tex.pants,part(e,[-0.125,0.55,0],sw));
  pushBox(out,[-0.125,-0.55,-0.125],[0.125,0,0.125],tex.pants,part(e,[0.125,0.55,0],-sw));
  pushBox(out,[-0.25,0,-0.125],[0.25,0.75,0.125],tex.shirt,part(e,[0,0.55,0],0));
  pushBox(out,[-0.125,-0.7,-0.125],[0.125,0.05,0.125],tex.arm,part(e,[-0.375,1.25,0],sw*0.8));
  pushBox(out,[-0.125,-0.7,-0.125],[0.125,0.05,0.125],tex.arm,part(e,[0.375,1.25,0],armR));
  pushBox(out,[-0.25,0,-0.25],[0.25,0.5,0.25],tex.face,part(e,[0,1.3,0],Math.max(-0.8,Math.min(0.8,e.pitch||0))));
}
onTap(document.getElementById('mpHost'),hostRoom);
onTap(document.getElementById('mpJoin'),joinRoom);
codeIn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
codeIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')joinRoom();});

// ---------- game flow ----------
const overlay=document.getElementById('overlay'),overEl=document.getElementById('over');
function newRun(){
  P.hp=MAXHP;P.safe=0;P.inv=0;spawn();enemies=[];kills=0;cookTotal=0;playTime=0;spawnTimer=2;cowTimer=10;mimicTimer=15;zombieTimer=4;pendingCook=0;dead=false;items=[];rockets=[];booms=[];fireHeld=false;
  const mb=STAGES[stage].mobs;if(mb.zero)spawnEnemy('zero');for(let i=0;i<Math.min(2,mb.cow);i++)spawnEnemy('cow');updateHud();
}
function gameOver(){
  sfx('gameOver');
  dead=true;started=false;resetTouch();for(const k in keys)keys[k]=false;
  if(document.exitPointerLock)try{document.exitPointerLock();}catch(e){}
  const m=Math.floor(playTime/60),s=Math.floor(playTime%60);
  document.getElementById('result').textContent=`エンティティゼロを ${kills} 体たおした。生きのびた時間は ${m}分${s}秒。料理スコアは ${cookTotal} 点。`;
  overEl.style.display='flex';
}
function lockMouse(){ if(!isTouch){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}} }
// テスト版：全ステージを最初から選べる（本番では false にする）
const TEST_ALL_STAGES=true;
let selStage=0;
const stageSelEl=document.getElementById('stagesel'),goalEl=document.getElementById('goal');
function renderStageSel(){
  stageSelEl.innerHTML='';
  STAGES.forEach((st,i)=>{const b=document.createElement('button');b.className='stg'+(i===selStage?' on':'');
    const lock=!TEST_ALL_STAGES&&i>progress.unlocked;b.disabled=lock;b.innerHTML='<span>'+(lock?'🔒':st.icon)+'</span>'+(i+1)+'. '+st.name;
    if(!lock)onTap(b,()=>{selStage=i;renderStageSel();});stageSelEl.appendChild(b);});
}
renderStageSel();
const appearSelEl=document.getElementById('appearsel');
function renderAppearSel(){
  appearSelEl.innerHTML='';
  APPEARANCES.forEach((a,i)=>{const b=document.createElement('button');b.className='apr'+(i===myAppearance?' on':'');
    const c=document.createElement('canvas');c.width=c.height=16;
    c.getContext('2d').drawImage(atlas,a.face*16,0,16,16,0,0,16,16);
    b.appendChild(c);b.appendChild(document.createTextNode(a.name));
    onTap(b,()=>{setAppearance(i);renderAppearSel();});appearSelEl.appendChild(b);});
}
renderAppearSel();
if(!/github\.io$|^localhost$|^127\./.test(location.hostname)&&location.protocol!=='file:')document.getElementById('mp').style.display='none';
window.startGame=()=>{initAudio();if(net.role!=='guest'&&selStage!==stage)goStage(selStage);overlay.style.display='none';started=true;lockMouse();updateGoalHud();};
onTap(document.getElementById('clearBtn'),()=>{document.getElementById('clear').style.display='none';clearing=false;goStage(0);lockMouse();});
function again(e){if(e)e.preventDefault();initAudio();overEl.style.display='none';newRun();started=true;lockMouse();}
const againBtn=document.getElementById('again');
againBtn.addEventListener('click',again);againBtn.addEventListener('touchend',again,{passive:false});
document.getElementById('reset').addEventListener('click',()=>{
  if(net.role==='guest'){mpSay('ゲストは世界を作り直せません',true);return;}
  genStage(stage);ensureTable();buildMesh();newRun();save();goalDone=false;stageStats={kills:0,gems:0,chests:0};updateGoalHud();
  if(net.connected&&net.role==='host')netSend({t:'world',w:encodeWorld(),x:P.x,y:P.y,z:P.z,s:stage});
});
addEventListener('resize',resize);

// ---------- start ----------
applyStageLook(0);
if(!load()) generate(20260922);
ensureTable();
buildMesh();newRun();select(0);nameEl.style.opacity=0;rebuildWbar();

const crossEl=document.getElementById('cross');
let last=performance.now();
function loop(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;
  if(started&&!paused()){const n=Math.ceil(dt/0.016);for(let i=0;i<n&&started&&!paused();i++)step(dt/n);}
  if(cooking)cookUpdate(dt);
  if(!started&&!dead) yaw+=dt*0.08; // タイトル画面だけ回す
  cam[0]=P.x;cam[1]=P.y+EYE;cam[2]=P.z;
  const r=started&&!paused()?raycast(6):null;
  if(r){hlOn=true;hlAt[0]=r.hit[0]+0.5;hlAt[1]=r.hit[1]+0.5;hlAt[2]=r.hit[2]+0.5;} else hlOn=false;
  netTick(dt);
  render();
  updateTags();
  crossEl.classList.toggle('target',started&&!paused()&&(weapon==='sword'||weapon==='pickaxe')&&!!findTarget(3.3));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
try{main();}catch(e){fail('ゲームを起動できませんでした：'+(e&&e.message?e.message:e));}
